# bundle @dsh-memory/memory-auto
# overrides vía env: DSH_MEMORY_PATH, DSH_MEMORY_SERVER_DIR
- insert:
    - id: memory-auto
      name: '@dsh-memory/memory-auto'
      config:
        memoryPath: !!js process.env.DSH_MEMORY_PATH ?? './memory-vault'
        serverDir: !!js process.env.DSH_MEMORY_SERVER_DIR ?? './memory-vault-server'
        provider: deepseek-official
        model: deepseek-v4-flash
        maxTokens: 2048
        minTranscriptChars: 200
        enabled: true

# bundle @luisarg/memory-auto
# overrides vía env: DSH_MEMORY_PATH, DSH_MEMORY_SERVER_DIR
# cwd-independent:
#   vault  -> ~/.memories (OS home, ignores DSH_HOME)
#   server -> $DSH_HOME/memory-vault-server (~/.dsh por defecto)
- insert:
    - id: memory-auto
      name: '@luisarg/memory-auto'
      config:
        memoryPath: !!js process.env.DSH_MEMORY_PATH ?? (process.env.HOME || process.env.USERPROFILE || '') + '/.memories'
        serverDir: !!js process.env.DSH_MEMORY_SERVER_DIR ?? dshHomePath('memory-vault-server')
        provider: deepseek-official
        model: deepseek-v4-flash
        maxTokens: 2048
        minTranscriptChars: 200
        enabled: true

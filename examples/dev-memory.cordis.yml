# dev overlay — memory MCP via repo relativo
# overrides vía env: DSH_MEMORY_PATH, DSH_MEMORY_SERVER_DIR
- insert:
    - id: memory-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: memory
        transport: stdio
        # launcher.mjs: uv run when uv on PATH, else pip venv fallback
        command: !!js process.execPath
        args: [!!js "(process.env.DSH_MEMORY_SERVER_DIR ?? process.cwd() + '/memory-vault-server') + '/launcher.mjs'"]
        env:
          MEMORY_PATH: !!js process.env.DSH_MEMORY_PATH ?? process.cwd() + '/memory-vault'
          UV_CACHE_DIR: /tmp/uv-cache
        cwd: !!js process.cwd()

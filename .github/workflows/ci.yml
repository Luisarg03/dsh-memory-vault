name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only reads the repository. Release auth lives in
# publish.yml, which asks for id-token: write on purpose.
permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # pnpm/action-setup MUST run before setup-node: setup-node resolves the
      # lockfile by running `pnpm --version`, so with cache: pnpm and no pnpm
      # on PATH yet it aborts with "Dependencies lock file is not found".
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # MUST run before Test: the integration tests spawn the vault server
      # through launcher.mjs, which falls back to `python3 -m venv` + pip when
      # no `uv` is on PATH — too slow for vitest's 5 s default test timeout.
      - name: Setup uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Build
        run: pnpm -r build
      - name: Test
        run: pnpm -r test
      # Catches a package.json/tag/lockstep mistake before a tag exists, so the
      # release job fails for one reason only (the registry), never for this.
      - name: Release guard
        run: node scripts/release-check.mjs
      - name: Server imports (uv-managed deps)
        run: uv run --directory memory-vault-server python -c "import server; print('server.py imports cleanly')"

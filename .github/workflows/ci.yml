name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm/action-setup MUST run before setup-node: setup-node resolves the
      # lockfile by running `pnpm --version`, so with cache: pnpm and no pnpm
      # on PATH yet it aborts with "Dependencies lock file is not found".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm -r build
      - name: Test
        run: pnpm -r test
      - uses: astral-sh/setup-uv@v5
      - name: Server imports (uv-managed deps)
        run: uv run --directory memory-vault-server python -c "import server; print('server.py imports cleanly')"

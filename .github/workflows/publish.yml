# Publishes both packages to npm when a release tag is pushed.
#
# Auth is npm Trusted Publishing (OIDC): no NPM_TOKEN anywhere. npm verifies the
# GitHub OIDC token against the Trusted Publisher registered on the package
# (this repo + this workflow file + the `release` environment), then attaches a
# provenance attestation automatically for public packages.
#
# One-time setup on npmjs.com, for BOTH @luisarg/memory-mcp and
# @luisarg/memory-auto: Settings -> Trusted Publisher -> GitHub Actions with
# repository Luisarg03/dsh-memory-vault, workflow `publish.yml`, environment
# `release`, allowed action `npm publish`. See docs/releasing.md.
name: publish

on:
  push:
    tags:
      - "v*"

# Least privilege: id-token to exchange for the npm OIDC token, contents to
# create the GitHub Release. Nothing else is granted.
permissions:
  contents: write
  id-token: write

# Two tags pushed back to back must not publish concurrently.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # A protected environment adds a human approval gate before the job starts.
    # Leave the environment unprotected for a fully automatic release; add
    # required reviewers if you want a click between the tag and npm.
    environment: release
    timeout-minutes: 30
    steps:
      # fetch-tags: without it the checkout has a tag *ref* but not the
      # annotated tag object, and `git cat-file -t` reports a lightweight tag,
      # which the release guard rejects.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # Node 24 ships npm >= 11.5.1, which Trusted Publishing needs. Do not
      # downgrade to Node 22 and `npm install -g npm@latest`: that replaces the
      # running npm process and dies with a missing-module error.
      #
      # NO registry-url here: setup-node writes a .npmrc and exports a
      # placeholder NODE_AUTH_TOKEN when it is set, and npm takes that token
      # path instead of the OIDC exchange. npm defaults to registry.npmjs.org
      # anyway, and the Preflight OIDC step below fails if that var reappears.
      #
      # package-manager-cache: false keeps a cache-poisoning path out of the
      # release job.
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      # Trusted publishing needs the registry in .npmrc — that is what makes npm
      # attempt the OIDC exchange at all — but NOT the placeholder
      # NODE_AUTH_TOKEN that setup-node's registry-url input exports. Set the
      # registry by hand; Preflight below rejects a stray NODE_AUTH_TOKEN.
      - name: Point npm at the public registry
        run: npm config set registry https://registry.npmjs.org/ --location project

      - name: Assert npm supports Trusted Publishing
        run: |
          version="$(npm --version)"
          echo "npm $version"
          if [ "$(printf '%s\n' 11.5.1 "$version" | sort -V | head -n1)" != "11.5.1" ]; then
            echo "::error::npm $version < 11.5.1 — bump node-version in this workflow"
            exit 1
          fi

      # Fail in the first minute, not after the build: a tag pushed without
      # `id-token: write`, or a workflow rename that invalidates the npm-side
      # Trusted Publisher entry, both surface right here.
      - name: Preflight OIDC
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::no OIDC token endpoint — the job needs permissions: id-token: write"
            exit 1
          fi
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NODE_AUTH_TOKEN is set; remove it so npm uses the OIDC exchange instead of a token"
            exit 1
          fi
          echo "OIDC endpoint present; publishing with Trusted Publishing (no token)"

      - name: Install
        run: pnpm install --frozen-lockfile

      # `pnpm -r build` runs only each package's build script; the vault server
      # and starter are bundled by the ROOT build, so `pnpm bundle` has to run
      # too. Skipping it publishes 8-file tarballs with no server — the exact
      # failure the tarball guard below exists to catch.
      - name: Build
        run: pnpm -r build

      - name: Bundle server + vault starter into the packages
        run: pnpm bundle

      - name: Test
        run: pnpm -r test

      # Tag, both package.json versions and HEAD must agree before anything
      # reaches the registry. --strict because CI checks out the tag itself.
      - name: Release guard
        run: node scripts/release-check.mjs --tag "$GITHUB_REF_NAME" --strict

      - name: Pack
        run: |
          mkdir -p dist-tarballs
          pnpm --filter @luisarg/memory-mcp pack --pack-destination dist-tarballs
          pnpm --filter @luisarg/memory-auto pack --pack-destination dist-tarballs
          # Fail here rather than at publish time if pnpm ever ignores the
          # destination: an empty publish step is hard to read in the log.
          ls -l dist-tarballs
          test "$(ls dist-tarballs/*.tgz | wc -l)" -eq 2

      # The tarball is the artifact users install: no vault data, no .venv,
      # no __pycache__, and the bundled server must actually be in there.
      - name: Validate tarballs
        run: node scripts/check-tarball.mjs dist-tarballs/*.tgz

      # npm publish on the tarball, not pnpm publish: it keeps OIDC and
      # provenance on the well-trodden path (pnpm 11 broke OIDC publishing) and
      # publishes exactly the artifact validated above.
      - name: Publish to npm (OIDC + provenance)
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          set -euo pipefail
          shopt -s nullglob
          published=0
          echo "node $(node --version) / npm $(npm --version)"
          echo "registry: $(npm config get registry)"
          echo "project .npmrc:"; cat .npmrc 2>/dev/null || echo "(none)"
          echo "ACTIONS_ID_TOKEN_REQUEST_URL set: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
          echo "NODE_AUTH_TOKEN set: ${NODE_AUTH_TOKEN:+yes}"
          # Absolute paths: npm reads a bare relative path as a package spec and
          # tries `git ls-remote ssh://git@github.com/<path>.git`.
          for tgz in "$PWD"/dist-tarballs/*.tgz; do
            name="$(tar -xzOf "$tgz" package/package.json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).name))')"
            version="$(tar -xzOf "$tgz" package/package.json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).version))')"

            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already on npm — skipping (idempotent re-run)"
              continue
            fi

            echo "::group::npm publish $name@$version"
            if npm publish "$tgz" --access public; then
              published=$((published + 1))
            else
              status=$?
              echo "::endgroup::"
              echo "::error::npm publish $name@$version failed (exit $status). A 404 here means the Trusted Publisher config on npmjs.com does not match this repo/workflow/environment, or the package does not exist yet (OIDC cannot create a brand-new package — publish its first version manually)."
              exit $status
            fi
            echo "::endgroup::"
          done
          echo "published=$published" >> "$GITHUB_OUTPUT"

      # The registry is eventually consistent right after a publish, so verify
      # through the CLI and confirm gitHead is this commit — that is the check
      # docs/releasing.md is built on.
      - name: Verify published artifacts
        run: |
          for dir in packages/memory-mcp packages/memory-auto; do
            name="$(node -p "require('./$dir/package.json').name")"
            version="$(node -p "require('./$dir/package.json').version")"
            head="$(npm view "$name@$version" gitHead)"
            echo "$name@$version gitHead=$head"
            if [ "$head" != "$GITHUB_SHA" ]; then
              echo "::error::$name@$version records gitHead $head, expected $GITHUB_SHA"
              exit 1
            fi
          done

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "Published \`@luisarg/memory-mcp\` and \`@luisarg/memory-auto\` to npm with provenance. Versions and commit mapping: docs/releasing.md." \
            --verify-tag
